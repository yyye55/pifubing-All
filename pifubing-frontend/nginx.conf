server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API 反向代理：/api/users/login -> backend:9094/users/login
    location /api/ {
        proxy_pass http://backend:9094/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式问答需要关闭缓冲并延长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 本地存储模式下上传的图片由后端提供
    location /uploads/ {
        proxy_pass http://backend:9094/uploads/;
        proxy_set_header Host $host;
    }

    # Hash 路由，普通静态资源即可
    location / {
        try_files $uri $uri/ /index.html;
    }
}
