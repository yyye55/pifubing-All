server {
    listen 80;
    server_name _;

    # 头像与多图问诊上传体积较大，默认 1m 会返回 413
    client_max_body_size 50m;

    # 图片问诊会把检索到的知识库文本打包进 URL 的 data 参数，长度可达十几 KB，
    # Nginx 默认请求行缓冲区只有 8k，会直接返回 414。
    client_header_buffer_size 16k;
    large_client_header_buffers 8 64k;

    root /usr/share/nginx/html;
    index index.html;

    # API 反向代理：/api/users/login -> backend:9094/users/login
    location /api/ {
        proxy_pass http://backend:9094/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式问答需要关闭缓冲并延长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 本地存储模式下上传的图片由后端提供
    location /uploads/ {
        proxy_pass http://backend:9094/uploads/;
        proxy_set_header Host $host;
    }

    # Hash 路由，普通静态资源即可
    location / {
        try_files $uri $uri/ /index.html;
    }
}
