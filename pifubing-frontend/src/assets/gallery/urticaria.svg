<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-label="荨麻疹医学示意图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fcfa"/>
      <stop offset="0.55" stop-color="#eef8f5"/>
      <stop offset="1" stop-color="#e2f1ed"/>
    </linearGradient>
    <radialGradient id="skin" cx="44%" cy="30%" r="82%">
      <stop offset="0" stop-color="#f3d0b9"/>
      <stop offset="0.6" stop-color="#e8b79b"/>
      <stop offset="1" stop-color="#d4977a"/>
    </radialGradient>
    <radialGradient id="flare" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#de8979" stop-opacity="0.72"/>
      <stop offset="0.6" stop-color="#d97e6f" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#d97e6f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wheal" cx="42%" cy="34%" r="70%">
      <stop offset="0" stop-color="#ffe9dc"/>
      <stop offset="0.52" stop-color="#f8d4c1"/>
      <stop offset="1" stop-color="#edb59e"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blurSmall" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="raise" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#9b5748" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <circle cx="250" cy="120" r="210" fill="#d9f0e9" opacity="0.62"/>
  <circle cx="1420" cy="690" r="230" fill="#e2f4ee" opacity="0.68"/>
  <circle cx="1490" cy="105" r="80" fill="#ffffff" opacity="0.6"/>
  <path d="M120 650c88-30 168-18 240 44" fill="none" stroke="#cfe8e1" stroke-width="20" stroke-linecap="round" opacity="0.55"/>
  <path d="M1180 180c70-30 140-24 204 14" fill="none" stroke="#ffffff" stroke-width="17" stroke-linecap="round" opacity="0.65"/>

  <!-- 皮肤局部：背部/前臂 -->
  <g transform="rotate(8 800 400)">
    <ellipse cx="800" cy="400" rx="575" ry="228" fill="#b7785d" opacity="0.15" filter="url(#blur)"/>
    <ellipse cx="800" cy="392" rx="566" ry="220" fill="url(#skin)"/>
    <ellipse cx="720" cy="320" rx="350" ry="100" fill="#ffe2cf" opacity="0.3" filter="url(#blur)"/>
    <path d="M260 420c62-126 196-204 382-218 208-15 356 62 518 132" fill="none" stroke="#f8d8c2" stroke-width="12" stroke-linecap="round" opacity="0.34"/>
    <path d="M300 500c160 62 348 84 568 46 124-21 244-62 342-104" fill="none" stroke="#c4876a" stroke-width="8" stroke-linecap="round" opacity="0.2"/>
  </g>

  <!-- 风团：周围红晕 + 中央苍白隆起 -->
  <g transform="rotate(8 800 400)">
    <!-- 左侧风团 -->
    <path d="M606 360c34-40 94-56 148-38 32 11 55 36 55 64 0 38-43 68-105 69-58 1-108-22-119-53-7-19 2-30 21-42z"
          fill="url(#flare)" filter="url(#blur)"/>
    <path d="M622 356c31-31 82-44 126-30 28 9 47 30 47 53 0 30-37 55-90 56-49 1-91-18-100-42-6-15 2-25 17-37z"
          fill="url(#wheal)" opacity="0.96" filter="url(#raise)"/>
    <path d="M640 348c22-20 58-29 91-21 18 4 31 15 34 27-18 8-42 13-69 13-25 0-47-5-64-14 2-2 5-4 8-5z"
          fill="#fff1e7" opacity="0.58" filter="url(#blurSmall)"/>

    <!-- 中间偏上风团 -->
    <path d="M822 300c40-42 104-54 156-30 33 15 52 43 44 70-9 33-54 53-115 48-58-5-101-33-105-64-2-10 6-18 20-24z"
          fill="url(#flare)" filter="url(#blur)"/>
    <path d="M838 302c35-32 88-41 130-22 26 12 40 33 33 54-8 26-46 42-96 38-47-4-82-26-85-51-1-8 6-14 18-19z"
          fill="url(#wheal)" opacity="0.96" filter="url(#raise)"/>
    <path d="M850 296c24-18 61-25 94-16 15 4 25 12 28 21-20 7-48 11-76 9-21-1-38-5-51-11l5-3z"
          fill="#fff1e7" opacity="0.58" filter="url(#blurSmall)"/>

    <!-- 右下风团 -->
    <path d="M760 488c36-36 96-48 146-28 30 12 48 36 42 60-7 30-48 48-101 44-51-4-89-28-94-55-2-9 2-15 7-21z"
          fill="url(#flare)" filter="url(#blur)"/>
    <path d="M776 488c31-27 80-36 121-20 24 10 38 28 32 46-7 23-41 37-85 34-42-3-73-22-78-44-1-6 4-11 10-16z"
          fill="url(#wheal)" opacity="0.96" filter="url(#raise)"/>
    <path d="M790 484c20-15 52-20 82-13 14 3 23 10 26 18-18 6-43 9-68 8-18-1-33-5-44-10l4-3z"
          fill="#fff1e7" opacity="0.58" filter="url(#blurSmall)"/>

    <!-- 细小风团与抓痕样高光 -->
    <ellipse cx="1010" cy="430" rx="52" ry="34" fill="#f4c8b5" opacity="0.55" filter="url(#blurSmall)"/>
    <ellipse cx="1000" cy="427" rx="34" ry="21" fill="#ffe2d3" opacity="0.6"/>
    <g stroke="#f8ded0" stroke-width="4" stroke-linecap="round" opacity="0.5">
      <path d="M566 448c19 10 37 16 57 19"/><path d="M1006 532c17-9 32-14 49-17"/>
      <path d="M642 300c12-12 25-21 40-28"/><path d="M918 518c12 9 24 16 37 20"/>
    </g>
  </g>

  <ellipse cx="800" cy="232" rx="300" ry="58" fill="#ffffff" opacity="0.16" filter="url(#blur)"/>
</svg>
