<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-label="湿疹样皮炎医学示意图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fcfa"/>
      <stop offset="0.55" stop-color="#edf8f4"/>
      <stop offset="1" stop-color="#e3f1ed"/>
    </linearGradient>
    <radialGradient id="skin" cx="46%" cy="34%" r="78%">
      <stop offset="0" stop-color="#f2cdb5"/>
      <stop offset="0.58" stop-color="#e8b89c"/>
      <stop offset="1" stop-color="#d69b7e"/>
    </radialGradient>
    <radialGradient id="erythema" cx="48%" cy="42%" r="60%">
      <stop offset="0" stop-color="#d97d6f" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#d47a6b" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#d47a6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="erythema2" cx="52%" cy="50%" r="55%">
      <stop offset="0" stop-color="#c9675b" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#c9675b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softSmall" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <circle cx="1380" cy="110" r="190" fill="#d9f0e9" opacity="0.62"/>
  <circle cx="190" cy="700" r="230" fill="#e2f4ee" opacity="0.7"/>
  <circle cx="105" cy="130" r="92" fill="#ffffff" opacity="0.55"/>
  <path d="M1230 640c92-44 174-22 250 62" fill="none" stroke="#cfe8e1" stroke-width="22" stroke-linecap="round" opacity="0.55"/>
  <path d="M160 205c58-48 128-55 196-19" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.6"/>

  <!-- 皮肤局部：用柔和的斜向椭圆表现前臂/肘窝 -->
  <g transform="rotate(-12 800 400)">
    <ellipse cx="800" cy="400" rx="575" ry="226" fill="#b7785d" opacity="0.16" filter="url(#soft)"/>
    <ellipse cx="800" cy="392" rx="566" ry="218" fill="url(#skin)"/>
    <ellipse cx="760" cy="330" rx="360" ry="100" fill="#ffe2cf" opacity="0.28" filter="url(#soft)"/>
    <path d="M255 400c40-128 182-210 360-224 208-16 354 62 520 132" fill="none" stroke="#f8d8c2" stroke-width="12" stroke-linecap="round" opacity="0.35"/>
    <path d="M330 520c160 58 342 86 560 46 120-22 238-64 330-104" fill="none" stroke="#c4876a" stroke-width="8" stroke-linecap="round" opacity="0.22"/>
  </g>

  <!-- 边界不清的红斑 -->
  <g transform="rotate(-12 800 400)">
    <ellipse cx="795" cy="393" rx="270" ry="116" fill="url(#erythema)" filter="url(#soft)"/>
    <path d="M626 354c48-44 118-58 190-48 63 9 113 42 127 82 12 36-18 76-78 92-85 23-181 9-234-29-38-27-43-64-5-97z"
          fill="url(#erythema2)" opacity="0.78" filter="url(#softSmall)"/>
    <path d="M662 360c37-24 86-35 137-30 48 5 88 23 108 48 15 19 13 39-8 54-26 19-74 27-123 22-51-5-95-22-116-45-13-14-13-32 2-49z"
          fill="#cb7568" opacity="0.34"/>
  </g>

  <!-- 丘疹与干燥脱屑 -->
  <g transform="rotate(-12 800 400)">
    <g fill="#b95f54" opacity="0.55">
      <circle cx="642" cy="370" r="7"/><circle cx="678" cy="342" r="6"/><circle cx="716" cy="352" r="5"/>
      <circle cx="754" cy="334" r="6"/><circle cx="795" cy="344" r="5"/><circle cx="836" cy="330" r="6"/>
      <circle cx="874" cy="348" r="5"/><circle cx="910" cy="366" r="7"/><circle cx="946" cy="388" r="6"/>
      <circle cx="700" cy="410" r="5"/><circle cx="748" cy="424" r="6"/><circle cx="802" cy="418" r="5"/>
      <circle cx="856" cy="420" r="6"/><circle cx="888" cy="404" r="5"/><circle cx="650" cy="398" r="5"/>
    </g>
    <g stroke="#f9e6d8" stroke-width="5" stroke-linecap="round" opacity="0.72">
      <path d="M690 388l24-13"/><path d="M734 376l20-15"/><path d="M784 380l25-11"/>
      <path d="M828 388l23-14"/><path d="M868 402l22-13"/><path d="M724 424l21-10"/>
      <path d="M780 438l25-12"/><path d="M834 434l22-12"/><path d="M876 424l20-11"/>
    </g>
    <g stroke="#f6dfd0" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <path d="M570 330c20-11 40-17 61-20"/><path d="M1000 450c18 10 37 16 57 18"/>
      <path d="M520 430c14 15 30 27 48 36"/><path d="M1060 380c14-10 28-17 43-22"/>
    </g>
  </g>

  <!-- 柔和高光，避免画面显得扁平 -->
  <ellipse cx="800" cy="240" rx="300" ry="60" fill="#ffffff" opacity="0.16" filter="url(#soft)"/>
</svg>
